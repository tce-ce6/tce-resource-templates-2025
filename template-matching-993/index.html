<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match the Column</title>
</head>

<body>

    <div class="container">
        <div class="logo"></div>
        <div id="titleTxt"></div>
        <div class="columns">
            <svg id="svg-container"></svg>
            <div class="column left" id="column-a">
                <div class="column-title left" id="column-a-title">Column A</div>
            </div>
            <div class="column right" id="column-b">
                <div class="column-title right" id="column-b-title">Column B</div>
            </div>
        </div>
        <div class="button-container">
            <button class="show-answer-btn">Solution</button>
            <button class="reset-btn">Reset</button>
        </div>
        <div id="feedback" class="feedback"></div>
    </div>
    <script>
        // For Production: Change below folderName based on target folder name.
        var folderName = 'lib';
        // ---------------------

        // Load styles.css
        const cssFile = 'styles.css';
        const link1 = document.createElement('link');
        link1.rel = 'stylesheet';
        link1.href = `${folderName}/${cssFile}`;
        document.head.appendChild(link1);

        // Load JS file
        document.write(`<script src="${folderName}/script.js"><\/script>`);
    </script>
</body>

</html>
